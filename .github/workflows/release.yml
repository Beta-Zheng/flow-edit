name: Release plugin
on:
  push:
    tags: ['*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate exact release tag
        run: node scripts/validate.cjs --tag "$GITHUB_REF_NAME"
      - run: npm run check
      - run: npm run release
      - run: npm run release:preflight
      - name: Attest the three Obsidian release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/flow-edit/main.js
            release/flow-edit/manifest.json
            release/flow-edit/styles.css
      - name: Verify provenance before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in release/flow-edit/main.js release/flow-edit/manifest.json release/flow-edit/styles.css; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - name: Publish the three Obsidian release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Flow Edit $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" release/flow-edit/main.js release/flow-edit/manifest.json release/flow-edit/styles.css
