name: Check plugin
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: flow-edit
          path: release/flow-edit/
          if-no-files-found: error
